<h2>Liste des utilisateurs</h2>
<p *ngIf="message">{{message}}</p>
<ul>
  <li *ngFor="let user of users">
    {{ user.name }} — {{ user.email }}
    <button (click)="deleteUser(user.id)">
      Supprimer
    </button>
    <button [routerLink]="['/users/edit',user.id]">
      Modifier
    </button>
  </li>
</ul>
