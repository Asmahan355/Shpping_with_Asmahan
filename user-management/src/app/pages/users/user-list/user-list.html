<div class="container mt-4">
<div class="d-flex justify-content-between align-items-center mb-3">
<h2>Liste des utilisateurs</h2>
  <a class="btn btn-success" routerLink="/add-user">
     Ajouter un utilisateur
  </a>
</div>
<p *ngIf="message" class="alert alert-success">{{message}}</p>

<div *ngIf="users.length === 0" class="alert alert-info mt-3">
  Aucun utilisateur trouvé.
</div>

<ul *ngIf="users.length > 0" class="list-group mt-3">
  <li *ngFor="let user of users" class="list-group-item d-flex justify-content-between align-items-center align-items-center">
    <div>
      <strong>{{ user.name }}</strong> <br>
      <small class="text-muted">{{ user.email }}</small>
    </div>
    <div>
    <button class="btn btn-danger btn-sm me-2" (click)="deleteUser(user.id)">
      Supprimer
    </button>
    <button  class="btn btn-primary btn-sm" [routerLink]="['/users/edit',user.id]">
      Modifier
    </button>
    </div>
  </li>
</ul>
</div>
